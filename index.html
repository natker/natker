<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>natker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #111111;
            line-height: 1.3;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* Главный контейнер — максимально похож на ваш скриншот */
        .container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        /* Логотип/имя — как на картинке */
        .logo {
            font-size: clamp(32px, 10vw, 64px);
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #000000;
            margin-bottom: 24px;
            line-height: 1.1;
        }

        /* Главный заголовок */
        .headline {
            font-size: clamp(22px, 6vw, 40px);
            font-weight: 600;
            color: #000000;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        /* Описание */
        .description {
            font-size: clamp(16px, 4.5vw, 20px);
            color: #444444;
            margin-bottom: 40px;
            line-height: 1.4;
        }

        /* Блок кнопок/ссылок */
        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 28px;
            row-gap: 16px;
        }

        .btn {
            font-size: 17px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary {
            background: none;
            border: none;
            color: #000000;
            padding: 0;
        }

        .btn-secondary {
            color: #000000;
            border-bottom: 1px solid #cccccc;
            padding-bottom: 2px;
        }

        .btn-secondary:hover {
            border-bottom-color: #000000;
        }

        .btn-primary:hover,
        .btn-secondary:hover {
            opacity: 0.6;
        }

        /* Адаптив для телефона: ссылки друг под другом, как чаще всего ломается */
        @media (max-width: 500px) {
            body {
                padding: 20px;
                align-items: flex-start;
                padding-top: 15vh;
            }
            .actions {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }
            .btn {
                font-size: 18px;
            }
        }

        /* Доп. нюанс: на очень узких экранах отступы поменьше */
        @media (max-width: 480px) {
            .logo {
                margin-bottom: 20px;
            }
            .description {
                margin-bottom: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">natker</div>
        <div class="headline">Создаём современные сайты и веб-сервисы</div>
        <div class="description">Разрабатываем быстрые, удобные и эффективные решения для вашего бизнеса</div>
        <div class="actions">
            <a href="#" class="btn btn-primary">Обсудить проект</a>
            <a href="#" class="btn btn-secondary">Смотреть работы →</a>
        </div>
    </div>
</body>
</html>
